<!doctype html>
<html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>ShiftGrid Prototype</title>
<style>
:root{--n:#070B14;--g:#D9B45B;--t:#19C3B2;--s:#E9DFC8;--m:#8FA3B8;--r:#E5484D;--ok:#2ECC71;--am:#F1A424}
*{box-sizing:border-box}
body{margin:0;color:var(--s);font:15px/1.5 'Segoe UI',system-ui,sans-serif;background-color:var(--n);background-image:url('data:image/svg+xml;utf8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2780%27 height=%2780%27%3E%3Cg fill=%27none%27 stroke=%27%23D9B45B%27 stroke-opacity=%27.09%27%3E%3Crect x=%2716%27 y=%2716%27 width=%2748%27 height=%2748%27/%3E%3Crect x=%2716%27 y=%2716%27 width=%2748%27 height=%2748%27 transform=%27rotate(45 40 40)%27/%3E%3Ccircle cx=%2740%27 cy=%2740%27 r=%2717%27/%3E%3C/g%3E%3C/svg%3E')}
header{padding:22px 28px 12px;background:linear-gradient(180deg,#0f2447,transparent);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:grid;grid-template-columns:repeat(3,11px);gap:2px;padding:6px;background:#0B2545;border-radius:9px;border:1px solid var(--g)}
.logo i{width:11px;height:11px;border-radius:2px;background:#1F4068}.logo i.on{background:var(--t)}.logo i.ck{background:#fff}
h1{margin:0;font-size:25px;letter-spacing:.5px}h1 b{color:var(--t)}
.ar{color:var(--g);font-size:16px;display:block;direction:rtl}
.tag{margin-left:auto;color:var(--am);font-size:12px;border:1px solid var(--am);padding:3px 12px;border-radius:20px}
.rs{background:none;border:1px solid #2a4170;color:var(--m);border-radius:16px;padding:3px 12px;cursor:pointer;font:inherit;font-size:12px}
nav{display:flex;gap:6px;padding:0 28px 14px;flex-wrap:wrap;border-bottom:1px solid #1c2c4a}
nav button{background:none;border:1px solid #1c2c4a;color:var(--m);padding:8px 16px;border-radius:22px;cursor:pointer;font:inherit}
nav button.on{color:#07101c;background:linear-gradient(90deg,var(--g),#f0d58c);border-color:var(--g);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:22px 28px 70px}
.card{background:rgba(16,30,56,.85);border:1px solid #243a63;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
h2{margin:0 0 12px;font-size:18px;color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{display:block;color:var(--m);font-size:12px}
input,select{width:100%;margin-top:4px;background:#0a1529;color:var(--s);border:1px solid #2a4170;border-radius:9px;padding:9px;font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #2a4170;border-radius:20px;padding:5px 12px;cursor:pointer;color:var(--s);font-size:13px}
.chip input{width:auto;margin:0}.chip.on{border-color:var(--t);background:rgba(25,195,178,.12)}
.btn{background:linear-gradient(90deg,var(--t),#4fe0cf);color:#041512;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;margin:4px 6px 4px 0}
.btn.s{background:none;border:1px solid var(--g);color:var(--g);padding:5px 12px;font-weight:600;font-size:12px}
.btn:disabled{opacity:.35;cursor:not-allowed}
table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid #1d3156;text-align:left;vertical-align:top;font-size:13px}th{color:var(--m);font-weight:600}
.p{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11px;font-weight:700;color:#06111d}.g{background:var(--ok)}.t{background:var(--t)}.a{background:var(--am)}.r{background:var(--r);color:#fff}
.m{color:var(--m)}.note{color:var(--m);font-size:12px;margin-top:10px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.kpi div{background:#0a1529;border:1px solid #243a63;border-radius:14px;padding:16px}.kpi b{font-size:34px;color:var(--g);display:block}
.bar{height:10px;background:#12213f;border-radius:6px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--t),var(--g))}
.steps{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.step{flex:1;min-width:150px;border:1px solid #2a4170;border-radius:12px;padding:12px;text-align:center;color:var(--m)}.step.on{border-color:var(--ok);background:rgba(46,204,113,.1);color:var(--s)}
.chk{display:flex;gap:8px;padding:4px 0;font-size:13px}.chk span:first-child{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;background:var(--ok);color:#041512;flex:none}
.chk.no span:first-child{background:var(--am)}
.hrs{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.hrs input{text-align:center}
.flag{color:#ffb4b6;font-size:13px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0b1830;border:1px solid var(--g);padding:10px 20px;border-radius:24px;opacity:0;transition:.3s;pointer-events:none}.toast.show{opacity:1}
</style></head><body>
<header><div class='logo'><i class='on'></i><i class='on'></i><i class='on'></i><i class='on'></i><i class='on'></i><i class='ck'></i><i class='on'></i><i class='on'></i><i class='on'></i></div>
<div><h1>Shift<b>Grid</b></h1><span class='ar'>قوى عاملة موثّقة</span></div>
<button class='rs' data-a='reset'>Reset</button><span class='tag'>Prototype - simulated data</span></header>
<nav><button data-t='request'>Request</button><button data-t='readiness'>Readiness</button><button data-t='worker'>Worker view</button><button data-t='time'>Timesheets</button><button data-t='insights'>Insights</button></nav>
<main id='v'></main><div class='toast' id='toast'></div>
<script>
const $=s=>document.querySelector(s);
const D=n=>{const d=new Date();d.setDate(d.getDate()+n);return d};
const fmt=d=>d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
const IND=['Construction & industrial','Warehouse & fulfilment','Farming & agriculture','Similar industries'];
const CT=['Pipe fitter','Welder','Mechanical technician','Rigger','Scaffolder','Electrician','Operator'];
const WT=['Picker / packer','Forklift operator','Inventory controller','Warehouse supervisor'];
const FT=['Farm operator','Irrigation technician','Machinery operator','Harvest supervisor'];
const TRC={'Construction & industrial':CT,'Warehouse & fulfilment':WT,'Farming & agriculture':FT,'Similar industries':[...CT,...WT,...FT]};
const TR=[...CT,...WT,...FT];
const RQ=['HSE induction','Confined-space entry','Welding support','Working at height','Rigging certificate','Forklift licence','Crane operator licence','Plant operation certificate','Manual handling awareness','Machinery-operation certificate','First aid','Food-hygiene awareness','Driving licence'];
const SRC={issuer:['Issuer-verified','g'],provider:['Provider-confirmed','t'],declared:['Declared','a']};
const H='HSE induction',C='Confined-space entry',WS='Welding support',WA='Working at height',RG='Rigging certificate',FL='Forklift licence',CR='Crane operator licence',PL='Plant operation certificate',MH='Manual handling awareness',MO='Machinery-operation certificate',FA='First aid',FH='Food-hygiene awareness',DL='Driving licence';
const mk=(n,t,g,y,l,p,av,c,ins,vis)=>({id:'WKR-'+n,trade:t,grade:g,yrs:y,lang:l,prov:p,avail:av,creds:c,ins:ins,vis:vis||'verified'});
const WK=[
mk('0412','Pipe fitter',2,7,'Hindi, English','Provider A',0,[[H,'issuer',200],[C,'provider',120],[WS,'declared',300]],1),
mk('0587','Pipe fitter',1,11,'Urdu, English','Provider A',0,[[H,'issuer',400],[C,'issuer',250],[WA,'provider',90]],1),
mk('0203','Pipe fitter',2,5,'Malayalam, English','Provider B',0,[[H,'issuer',150],[C,'provider',12]],1),
mk('0931','Pipe fitter',3,3,'Bengali, Hindi','Provider B',6,[[H,'issuer',300]],1),
mk('0356','Pipe fitter',2,8,'Hindi, basic Arabic','Provider C',2,[[H,'issuer',220],[C,'issuer',180]],1),
mk('0644','Pipe fitter',1,13,'Urdu, basic Arabic','Provider C',0,[[H,'issuer',330],[C,'provider',200],[WA,'issuer',260]],0),
mk('0718','Welder',2,6,'Hindi, English','Provider A',1,[[H,'issuer',210],[WS,'issuer',140],[C,'declared',500]],1),
mk('0822','Welder',1,10,'Urdu, English','Provider B',0,[[H,'issuer',300],[WS,'issuer',280],[WA,'provider',150]],1),
mk('0129','Welder',3,2,'Bengali, Hindi','Provider C',9,[[H,'provider',100]],1),
mk('0475','Mechanical technician',2,7,'Hindi, English','Provider A',0,[[H,'issuer',260],[C,'provider',220]],1),
mk('0539','Mechanical technician',1,12,'Urdu, English','Provider B',3,[[H,'issuer',360],[C,'issuer',300],[WA,'issuer',180]],1),
mk('0690','Rigger',2,9,'Hindi, basic Arabic','Provider C',0,[[H,'issuer',240],[RG,'issuer',200],[WA,'issuer',160]],1),
mk('0761','Rigger',3,4,'Malayalam, English','Provider A',0,[[H,'issuer',100],[RG,'provider',90]],1),
mk('0884','Scaffolder',2,8,'Urdu, Hindi','Provider B',0,[[H,'issuer',250],[WA,'issuer',210]],1),
mk('0912','Electrician',2,6,'Hindi, English','Provider C',4,[[H,'issuer',280],[WA,'provider',130]],1),
mk('0305','Electrician',1,11,'Urdu, English','Provider A',0,[[H,'issuer',310],[WA,'issuer',270],[C,'provider',140]],1,'hidden'),
mk('1101','Operator',2,9,'Hindi, English','Provider A',0,[[H,'issuer',400],[FL,'issuer',300],[PL,'provider',180]],1),
mk('1142','Operator',1,12,'Urdu, English','Provider A',0,[[H,'issuer',350],[FL,'issuer',280],[CR,'provider',150]],1),
mk('1187','Operator',2,6,'Bengali, Hindi','Provider B',2,[[H,'issuer',220],[FL,'provider',140]],1),
mk('1213','Operator',3,4,'Malayalam, English','Provider B',5,[[H,'provider',120],[PL,'declared',400]],1),
mk('1258','Operator',2,8,'Hindi, basic Arabic','Provider C',0,[[H,'issuer',260],[CR,'issuer',210],[PL,'issuer',190]],1),
mk('1304','Operator',1,15,'Urdu, basic Arabic','Provider C',0,[[H,'issuer',380],[FL,'issuer',320],[CR,'issuer',290],[PL,'provider',220]],1),
mk('1347','Operator',2,3,'Bengali, Hindi','Provider A',7,[[H,'issuer',180],[FL,'provider',100]],1),
mk('1391','Operator',3,7,'Hindi, English','Provider B',0,[[H,'issuer',290],[CR,'issuer',240],[PL,'issuer',200]],1),
mk('1436','Operator',1,10,'Urdu, English','Provider C',0,[[H,'issuer',330],[FL,'issuer',300],[PL,'provider',250]],1,'hidden'),
mk('2101','Picker / packer',1,4,'Hindi, English','Provider A',0,[[H,'issuer',300],[MH,'issuer',200],[FA,'provider',180]],1),
mk('2142','Picker / packer',1,6,'Urdu, English','Provider B',0,[[H,'issuer',280],[MH,'issuer',240],[FH,'provider',150]],1),
mk('2187','Picker / packer',2,3,'Bengali, Hindi','Provider C',2,[[H,'provider',150],[MH,'declared',300]],1),
mk('2213','Forklift operator',2,7,'Hindi, English','Provider A',0,[[H,'issuer',350],[FL,'issuer',300],[MH,'issuer',220]],1),
mk('2258','Forklift operator',1,10,'Urdu, English','Provider B',0,[[H,'issuer',320],[FL,'issuer',280],[DL,'provider',260]],1),
mk('2304','Forklift operator',2,5,'Malayalam, English','Provider C',3,[[H,'issuer',240],[FL,'provider',180],[MH,'issuer',200]],1),
mk('2347','Inventory controller',2,8,'Hindi, English','Provider A',0,[[H,'issuer',300],[MH,'issuer',250],[FA,'provider',200]],1),
mk('2391','Inventory controller',1,6,'Urdu, English','Provider B',1,[[H,'issuer',260],[MH,'provider',200],[FH,'issuer',180]],1),
mk('2436','Warehouse supervisor',3,9,'Hindi, English','Provider A',0,[[H,'issuer',400],[MH,'issuer',300],[FA,'issuer',280],[DL,'provider',250]],1),
mk('3101','Farm operator',1,6,'Hindi, English','Provider A',0,[[H,'issuer',280],[MO,'issuer',240],[FA,'provider',200]],1),
mk('3142','Farm operator',1,8,'Urdu, English','Provider B',0,[[H,'issuer',300],[MO,'issuer',260],[FH,'provider',180]],1),
mk('3187','Irrigation technician',2,7,'Hindi, English','Provider C',0,[[H,'issuer',320],[MO,'issuer',280],[FA,'provider',220]],1),
mk('3213','Irrigation technician',1,5,'Bengali, Hindi','Provider A',2,[[H,'provider',180],[MO,'declared',300]],1),
mk('3258','Machinery operator',2,9,'Hindi, English','Provider B',0,[[H,'issuer',360],[MO,'issuer',320],[DL,'issuer',280]],1),
mk('3304','Machinery operator',1,11,'Urdu, English','Provider C',0,[[H,'issuer',340],[MO,'issuer',300],[PL,'provider',240]],1),
mk('3347','Harvest supervisor',3,8,'Malayalam, English','Provider A',0,[[H,'issuer',380],[MO,'issuer',300],[FA,'issuer',260],[FH,'provider',220]],1),
mk('3391','Harvest supervisor',2,6,'Hindi, basic Arabic','Provider B',4,[[H,'issuer',280],[MO,'provider',240],[FH,'issuer',200]],1)];
let S=load()||{tab:'request',req:{industry:'Construction & industrial',trade:'Pipe fitter',qty:4,start:3,days:14,reqs:[H,C]},rid:[],short:[],bk:[],cur:0,ws:{},log:[],wsel:'WKR-0412'};
if(!S.req.industry){S.req.industry='Construction & industrial';S.req.trade='Pipe fitter';S.rid=[];S.short=[]}
function load(){try{return JSON.parse(localStorage.getItem('sg1'))}catch(e){return null}}
function save(){localStorage.setItem('sg1',JSON.stringify(S))}
function wk(id){return Object.assign({},WK.find(x=>x.id===id),S.ws[id]||{})}
function ev(id,r){const w=wk(id);if(w.vis==='hidden')return null;const end=r.start+r.days,is=[];
r.reqs.forEach(q=>{const c=w.creds.find(x=>x[0]===q);if(!c)is.push({k:'cred',t:'Missing: '+q});else if(c[1]==='declared')is.push({k:'cred',t:'Declared only, needs verification: '+q});else if(c[2]<end)is.push({k:'cred',t:q+' expires '+fmt(D(c[2]))+', before assignment ends'})});
if(w.avail>r.start)is.push({k:'avail',t:'Available from '+fmt(D(w.avail))});
if(!w.ins)is.push({k:'ins',t:'Health insurance pending'});
return {w:w,is:is,ok:is.length===0}}
function calc(h,rate){let ot=0,tot=0,days=0;const flags=[];h.forEach((x,i)=>{tot+=x;if(x>0)days++;if(x>8)ot+=x-8;if(x>10)flags.push('Day '+(i+1)+': '+x+'h exceeds 10h per day')});
let reg=tot-ot;if(reg>48){ot+=reg-48;reg=48}if(days===7)flags.push('No rest day recorded in the 7-day week');
return {tot:tot,reg:reg,ot:ot,days:days,flags:flags,pay:reg*rate+ot*rate*1.25}}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}
function cur(){return S.bk[S.cur]}
function tsOf(b){S.tw=S.tw&&b.ws.includes(S.tw)?S.tw:b.ws[0];return b.ts[S.tw]=b.ts[S.tw]||{h:[8,8,9,8,10,8,8],rate:18,ap:0,pd:0,iv:0,q:0,ex:0}}
const empty=t=>`<section class='card'><h2>${t}</h2><p class='m'>No booking yet. Shortlist workers on the Request tab and book them.</p></section>`;
const bsel=()=>S.bk.length>1?`<label>Booking<select data-f='cur'>${S.bk.map((b,i)=>`<option value='${i}' ${i==S.cur?'selected':''}>${b.id}: ${b.req.trade} x${b.ws.length}</option>`).join('')}</select></label>`:'';
const V={
request(){const r=S.req;let h=`<section class='card'><h2>New workforce request</h2><div class='grid'>
<label>Industry<select data-f='industry'>${IND.map(i=>`<option ${i==r.industry?'selected':''}>${i}</option>`).join('')}</select></label>
<label>Trade<select data-f='trade'>${TRC[r.industry].map(t=>`<option ${t==r.trade?'selected':''}>${t}</option>`).join('')}</select></label>
<label>Workers needed<input type='number' min='1' max='200' data-f='qty' value='${r.qty}'></label>
<label>Start in (days)<input type='number' min='0' max='60' data-f='start' value='${r.start}'></label>
<label>Duration (days)<input type='number' min='1' max='365' data-f='days' value='${r.days}'></label></div>
<div class='chips'>${RQ.map(q=>`<label class='chip ${r.reqs.includes(q)?'on':''}'><input type='checkbox' data-f='req' value='${q}' ${r.reqs.includes(q)?'checked':''}> ${q}</label>`).join('')}</div>
<button class='btn' data-a='find'>Find ready workers</button>
<p class='note'>Matching is skills-based. Names, nationality and religion are not shown or searchable. Workers who hid their profile are excluded. Operator and machinery roles require the relevant licence or certificate for the equipment in question.</p>
<p class='note'>Modelled on the operating patterns of large-scale fulfilment, retail supply-chain and agricultural production networks. No customer names, logos, endorsements or implied relationships are included.</p></section>`;
const rs=S.rid.map(id=>ev(id,r)).filter(Boolean);
if(S.rid.length){h+=`<section class='card'><h2>${rs.length} candidates, ${rs.filter(x=>x.ok).length} ready</h2><table><tr><th>Worker</th><th>Experience</th><th>Employer of record</th><th>Readiness</th><th></th></tr>`+
rs.map(x=>`<tr><td><b>${x.w.id}</b><br><span class='m'>${x.w.trade}, Grade ${x.w.grade}</span></td><td>${x.w.yrs} yrs<br><span class='m'>${x.w.lang}</span></td><td>${x.w.prov}<br><span class='m'>Licensed provider</span></td><td><span class='p ${x.ok?'g':'a'}'>${x.ok?'Ready':'Needs review'}</span><div class='m'>${x.is.map(i=>i.t).join('<br>')}</div></td><td><button class='btn s' data-a='sl' data-id='${x.w.id}'>${S.short.includes(x.w.id)?'Remove':'Shortlist'}</button></td></tr>`).join('')+
`</table><p class='note'>Shortlisted: ${S.short.length} of ${r.qty} needed.</p><button class='btn' data-a='book' ${S.short.length?'':'disabled'}>Book shortlisted workers</button></section>`}
return h},
readiness(){const b=cur();if(!b)return empty('Readiness');
return `<section class='card'><h2>Readiness for ${b.id}: ${b.req.trade}, ${b.ws.length} workers</h2><div class='grid'>${bsel()}</div><p class='note'>Readiness is assignment-specific and based on the evidence on file. Final deployment follows provider and customer processes.</p></section>`+
b.ws.map(id=>{const e=ev(id,b.req)||{w:wk(id),is:[{k:'vis',t:'Profile hidden by worker'}],ok:false};const has=k=>e.is.some(i=>i.k===k);
const it=[['Identity checked with worker consent',true],['Required credentials verified and valid',!has('cred')],['Employment route: '+e.w.prov+' (licensed provider, employer of record)',true],['Availability reconfirmed',!has('avail')],['Health insurance active',!has('ins')&&!has('vis')]];
const pc=Math.round(it.filter(x=>x[1]).length/it.length*100);
return `<section class='card'><b>${e.w.id}</b> <span class='p ${e.ok?'g':'a'}'>${e.ok?'Ready to mobilise':'Not ready'}</span> <span class='m'>${pc}%</span><div class='bar'><i style='width:${pc}%'></i></div>${it.map(x=>`<div class='chk ${x[1]?'':'no'}'><span>${x[1]?'&#10003;':'!'}</span><span>${x[0]}</span></div>`).join('')}
${e.is.length?`<p class='flag'>${e.is.map(i=>i.t).join('<br>')}</p>`:''}
${has('avail')?`<button class='btn s' data-a='rec' data-id='${e.w.id}'>Worker reconfirms availability</button>`:''}${has('ins')?`<button class='btn s' data-a='insu' data-id='${e.w.id}'>Provider confirms insurance</button>`:''}</section>`}).join('')},
worker(){const w=wk(S.wsel);
return `<section class='card'><h2>Worker view (simulated app)</h2><div class='grid'><label>Sign in as<select data-f='wsel'>${WK.map(x=>`<option ${x.id==S.wsel?'selected':''}>${x.id}</option>`).join('')}</select></label></div></section>
<section class='card'><h2>${w.id}: ${w.trade}, Grade ${w.grade}</h2><p class='m'>${w.yrs} years | ${w.lang} | Employer of record: ${w.prov}</p>
<h2 style='font-size:15px'>Credentials</h2><table>${w.creds.map(c=>`<tr><td>${c[0]}</td><td><span class='p ${SRC[c[1]][1]}'>${SRC[c[1]][0]}</span></td><td class='m'>Expires ${fmt(D(c[2]))}</td></tr>`).join('')}</table>
<div class='grid' style='margin-top:14px'><label>Who can see my profile<select data-f='vis'><option value='verified' ${w.vis=='verified'?'selected':''}>All verified employers</option><option value='invited' ${w.vis=='invited'?'selected':''}>Invited employers only</option><option value='hidden' ${w.vis=='hidden'?'selected':''}>Hidden</option></select></label>
<label>Availability<input disabled value='${w.avail==0?'Available now':'From '+fmt(D(w.avail))}'></label></div>
<button class='btn s' data-a='corr' data-id='${w.id}'>Request correction</button>
<p class='note'>Consent is separate for matching, credential verification and timesheets. Deletion requests are handled subject to lawful retention requirements. Not visible to customers: identity documents, health data, salary history.</p>
${S.log.length?`<p class='m'>Correction log:<br>${S.log.map(x=>x).join('<br>')}</p>`:''}</section>`},
time(){const b=cur();if(!b)return empty('Timesheets');const t=tsOf(b);const c=calc(t.h,t.rate);const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
return `<section class='card'><h2>Timesheet and pay statement (sample)</h2><div class='grid'>${bsel()}<label>Worker<select data-f='tw'>${b.ws.map(id=>`<option ${id==S.tw?'selected':''}>${id}</option>`).join('')}</select></label><label>Sample hourly rate (AED)<input type='number' min='1' data-f='rate' value='${t.rate}'></label></div>
<div class='hrs' style='margin-top:12px'>${days.map((d,i)=>`<label>${d}<input type='number' min='0' max='16' data-f='hr' data-i='${i}' value='${t.h[i]}'></label>`).join('')}</div>
<table style='margin-top:14px'><tr><td>Total hours</td><td><b>${c.tot}</b></td></tr><tr><td>Regular hours</td><td>${c.reg}</td></tr><tr><td>Overtime hours (125% of rate, illustrative)</td><td>${c.ot}</td></tr><tr><td>Deductions</td><td>None recorded</td></tr><tr><td><b>Gross pay (sample)</b></td><td><b>AED ${c.pay.toFixed(2)}</b></td></tr><tr><td>Wage due date (sample, set by contract)</td><td>${fmt(D(5))}</td></tr></table>
${c.flags.length?`<p class='flag'>Flags: ${c.flags.join(' | ')}</p>`:`<p class='m'>No hours flags.</p>`}
<button class='btn s' data-a='q'>Query hours</button><button class='btn s' data-a='ex' ${c.flags.length&&!t.ex?'':'disabled'}>Record lawful exception</button>
<div class='steps'><div class='step ${t.ap?'on':''}'>Hours approved</div><div class='step ${t.pd?'on':''}'>Wages paid by due date</div><div class='step ${t.iv?'on':''}'>Customer invoice reconciled</div></div>
<button class='btn' data-a='ap' ${t.ap?'disabled':''}>Supervisor approves hours</button><button class='btn' data-a='pd' ${t.ap&&!t.pd?'':'disabled'}>Provider pays wages</button><button class='btn' data-a='iv' ${t.ap&&!t.iv?'':'disabled'}>Reconcile customer invoice</button>
<p class='note'>${t.q?'Query raised with provider and supervisor. ':''}Wage payment does not wait for the customer invoice. Approval is blocked while flags are open unless an exception is recorded. Rules are illustrative and need UAE legal review.</p></section>`},
insights(){const nb=S.bk.length,wb=S.bk.reduce((a,b)=>a+b.ws.length,0);let ready=0,tot=0,ap=0,pd=0;
S.bk.forEach(b=>{b.ws.forEach(id=>{const e=ev(id,b.req);tot++;if(e&&e.ok)ready++});Object.values(b.ts).forEach(t=>{if(t.ap){ap++;if(t.pd)pd++}})});
const sup=TR.map(t=>[t,WK.filter(w=>w.trade===t&&wk(w.id).vis!=='hidden').length]).filter(x=>x[1]>0);const mx=Math.max(...sup.map(x=>x[1]));
return `<section class='card'><h2>Pilot dashboard (simulated)</h2><div class='kpi'><div><b>${nb}</b>Bookings</div><div><b>${wb}</b>Workers booked</div><div><b>${tot?Math.round(ready/tot*100)+'%':'-'}</b>Ready at mobilisation</div><div><b>${ap?Math.round(pd/ap*100)+'%':'-'}</b>Approved timesheets paid</div></div></section>
<section class='card'><h2>Visible supply by trade</h2>${sup.map(x=>`<div>${x[0]} <span class='m'>${x[1]}</span></div><div class='bar'><i style='width:${Math.round(x[1]/mx*100)}%'></i></div>`).join('')}<p class='note'>All figures come from simulated records in this browser.</p></section>`}};
const A={
find(){const r=S.req;const rs=WK.filter(w=>w.trade===r.trade).map(w=>ev(w.id,r)).filter(Boolean).sort((a,b)=>b.ok-a.ok||b.w.yrs-a.w.yrs);S.rid=rs.map(x=>x.w.id);S.short=rs.filter(x=>x.ok).slice(0,r.qty).map(x=>x.w.id);toast(rs.length+' candidates, '+S.short.length+' ready shortlisted')},
sl(id){S.short=S.short.includes(id)?S.short.filter(x=>x!==id):[...S.short,id]},
book(){S.bk.push({id:'BK-'+(1041+S.bk.length),req:Object.assign({},S.req,{reqs:[...S.req.reqs]}),ws:[...S.short],ts:{}});S.cur=S.bk.length-1;S.tab='readiness';toast('Booking created')},
rec(id){S.ws[id]=Object.assign(S.ws[id]||{},{avail:0});toast('Availability reconfirmed by worker (simulated)')},
insu(id){S.ws[id]=Object.assign(S.ws[id]||{},{ins:1});toast('Insurance confirmed by provider (simulated)')},
corr(id){S.log.push(id+': correction requested on '+new Date().toLocaleTimeString());toast('Correction request logged')},
q(){tsOf(cur()).q=1;toast('Query sent to provider and supervisor')},
ex(){tsOf(cur()).ex=1;toast('Exception recorded for review')},
ap(){const t=tsOf(cur());const c=calc(t.h,t.rate);if(c.flags.length&&!t.ex){toast('Resolve flags or record an exception first');return}t.ap=1;toast('Hours approved')},
pd(){tsOf(cur()).pd=1;toast('Wages paid via provider payroll (simulated)')},
iv(){tsOf(cur()).iv=1;toast('Customer invoice reconciled separately')},
reset(){localStorage.removeItem('sg1');location.reload()}};
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));$('#v').innerHTML=V[S.tab]();save()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-t],[data-a]');if(!b)return;if(b.dataset.t){S.tab=b.dataset.t}else{A[b.dataset.a](b.dataset.id)}render()});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(!f)return;const v=e.target.value,r=S.req;
if(f==='req'){r.reqs=e.target.checked?[...r.reqs,v]:r.reqs.filter(x=>x!==v)}
else if(f==='industry'){r.industry=v;r.trade=TRC[v][0];r.reqs=[H,C];S.rid=[];S.short=[]}
else if(f==='trade'){r.trade=v;S.rid=[];S.short=[]}
else if(f==='qty'||f==='start'||f==='days')r[f]=Math.max(0,+v||0);
else if(f==='cur')S.cur=+v;else if(f==='tw')S.tw=v;else if(f==='wsel')S.wsel=v;
else if(f==='vis'){S.ws[S.wsel]=Object.assign(S.ws[S.wsel]||{},{vis:v})}
else if(f==='hr'){tsOf(cur()).h[+e.target.dataset.i]=Math.max(0,Math.min(16,+v||0))}
else if(f==='rate'){tsOf(cur()).rate=Math.max(1,+v||1)}
render()});
render();
</script></body></html>
